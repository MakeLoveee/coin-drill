<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Coin Drill">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head><body>
<title>Coin Drill</title>

<style>
/* Layout: one narrow column, drill card on top, big thumb-reach action buttons below */
:root{
  --bg:#f2f3ef; --surface:#ffffff; --sunk:#e8eae4; --ink:#17201b; --muted:#5d6861; --line:#d6dad2;
  --accent:#1d6b58; --accent-ink:#ffffff;
  --raise:#c4473d; --allin:#7a3f9e; --call:#2c8a55; --fold:#8b948e;
  --good:#2c8a55; --mix:#b07a1c; --bad:#c4473d;
  --card:#fbfbf8; --card-edge:#cfd3cb; --s:#151515; --h:#c62f2a; --d:#1f5ec0; --c:#2a8a3c;
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --num: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1311; --surface:#171d1a; --sunk:#202723; --ink:#e7ece8; --muted:#97a29b; --line:#2b3430;
  --accent:#4dbb99; --accent-ink:#08130f;
  --raise:#e06459; --allin:#a879c8; --call:#4bb27a; --fold:#68736c;
  --good:#4bb27a; --mix:#d9a441; --bad:#e06459;
  --card:#f1f1ec; --card-edge:#3a4440; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1311; --surface:#171d1a; --sunk:#202723; --ink:#e7ece8; --muted:#97a29b; --line:#2b3430;
  --accent:#4dbb99; --accent-ink:#08130f;
  --raise:#e06459; --allin:#a879c8; --call:#4bb27a; --fold:#68736c;
  --good:#4bb27a; --mix:#d9a441; --bad:#e06459;
  --card:#f1f1ec; --card-edge:#3a4440; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-block:14px 28px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.02em}
nav{display:flex;gap:6px}
button{font:inherit;color:inherit;cursor:pointer}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.groups{display:flex;flex-direction:column}
.grp{border-top:1px solid var(--line)}
.grp:first-child{border-top:0}
.grow{display:flex;align-items:center;gap:10px;padding:10px 0}
.grow label{flex:1;display:flex;align-items:center;gap:10px;font-weight:600;min-width:0}
.cnt{font-family:var(--num);font-size:12px;color:var(--muted)}
.exp{border:0;background:transparent;color:var(--muted);font-size:13px;padding:4px 6px}
.spots{display:flex;flex-direction:column;gap:2px;padding:0 0 10px 30px}
.spots label{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:4px 0}
.spots label span{min-width:0}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none;margin-top:1px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.primary{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:14px;font-weight:700;font-size:16px;width:100%}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:13px}
.hint{font-size:13px;color:var(--muted)}
/* drill */
.score{display:flex;gap:14px;font-family:var(--num);font-size:13px;color:var(--muted)}
.score b{color:var(--ink);font-weight:600}
.spot{display:flex;flex-direction:column;gap:4px}
.spot .g{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.spot h2{margin:0;font-size:20px;line-height:1.2;text-wrap:balance}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.chip.layer{background:var(--ink);color:var(--bg)}
.hand{display:flex;justify-content:center;align-items:center;gap:10px;padding:14px 0 6px}
.card{width:84px;height:118px;border-radius:10px;background:var(--card);border:1px solid var(--card-edge);
  box-shadow:0 2px 6px rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.card .r{font-size:44px;font-weight:700;line-height:1;font-family:var(--ui)}
.card .su{font-size:30px;line-height:1}
.c-s{color:var(--s)} .c-h{color:var(--h)} .c-d{color:var(--d)} .c-c{color:var(--c)}
.handname{text-align:center;font-family:var(--num);font-size:13px;color:var(--muted)}
.acts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(88px,1fr))}
.act{border:0;border-radius:12px;padding:16px 8px;font-weight:700;font-size:16px;color:#fff}
.act[data-k="fold"]{background:var(--fold)} .act[data-k="call"],.act[data-k="cont"]{background:var(--call)}
.act[data-k="3bet"],.act[data-k="4bet"],.act[data-k="open"]{background:var(--raise)} .act[data-k="4bai"]{background:var(--allin)}
.act:disabled{opacity:.45}
.act.picked{outline:3px solid var(--ink);outline-offset:2px;opacity:1}
.verdict{display:flex;flex-direction:column;gap:8px}
.vt{font-weight:700;font-size:17px}
.vt.ok{color:var(--good)} .vt.mix{color:var(--mix)} .vt.bad{color:var(--bad)}
.bars{display:flex;flex-direction:column;gap:5px}
.bar{display:grid;grid-template-columns:96px 1fr 42px;gap:8px;align-items:center;font-size:13px}
.bar .t{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.bar .t i{display:block;height:100%}
.bar .p{font-family:var(--num);text-align:right}
.chartwrap{overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:300px}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:9px;font-family:var(--num);color:#fff;
  text-shadow:0 0 2px rgba(0,0,0,.6);position:relative}
.cell.cur{outline:2px solid var(--ink);outline-offset:-2px;z-index:1}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.foot{display:flex;gap:8px}
.foot .ghost{flex:1}
/* stats */
.st{display:grid;grid-template-columns:1fr auto auto;gap:6px 12px;font-size:13px;align-items:center}
.st .n{font-family:var(--num);color:var(--muted);text-align:right}
.st .a{font-family:var(--num);font-weight:600;text-align:right;min-width:44px}
.st h3{grid-column:1/-1;margin:10px 0 0;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.empty{color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:no-preference){.card{animation:deal .18s ease-out}@keyframes deal{from{transform:translateY(6px);opacity:.3}}}
</style>

<div class="wrap">
  <header>
    <div class="brand">Coin Drill<small>диапазоны CoinPoker, анте 0.25</small></div>
    <nav>
      <button class="tab" id="t-setup" aria-pressed="true">Споты</button>
      <button class="tab" id="t-drill" aria-pressed="false">Трен</button>
      <button class="tab" id="t-stats" aria-pressed="false">Стата</button>
    </nav>
  </header>

  <section id="v-setup" class="panel">
    <div>
      <div class="label">Против кого</div>
      <div class="seg" id="layer">
        <button data-v="agro" aria-pressed="false">Агро</button>
        <button data-v="avg" aria-pressed="true">Средние</button>
        <button data-v="pas" aria-pressed="false">Пассив / фиш</button>
      </div>
    </div>
    <div>
      <div class="label">Какие руки раздавать</div>
      <div class="seg" id="mode">
        <button data-v="all" aria-pressed="false">Все</button>
        <button data-v="edge" aria-pressed="true">Пограничные</button>
        <button data-v="err" aria-pressed="false">Мои ошибки</button>
      </div>
    </div>
    <div class="row" style="justify-content:space-between;align-items:center">
      <div class="label">Споты</div>
      <div class="row"><button class="ghost" id="all-on">Все</button><button class="ghost" id="all-off">Снять</button></div>
    </div>
    <div class="groups" id="groups"></div>
    <button class="primary" id="go">Начать</button>
    <p class="hint" id="sel-hint"></p>
  </section>

  <section id="v-drill" hidden>
    <div class="panel">
      <div class="score"><span>Раздач <b id="sc-n">0</b></span><span>Точность <b id="sc-a">-</b></span><span>Серия <b id="sc-s">0</b></span></div>
      <div class="spot">
        <span class="g" id="d-group"></span>
        <h2 id="d-title"></h2>
        <div class="chips" id="d-chips"></div>
      </div>
      <div class="hand" id="d-hand"></div>
      <div class="handname" id="d-hname"></div>
      <div class="acts" id="d-acts"></div>
      <div class="verdict" id="d-verdict" hidden>
        <div class="vt" id="d-vt"></div>
        <div class="bars" id="d-bars"></div>
      </div>
      <div class="foot" id="d-foot" hidden>
        <button class="ghost" id="d-chart-btn">Чарт</button>
        <button class="primary" id="d-next" style="flex:2">Дальше</button>
      </div>
      <div id="d-chart" hidden>
        <div class="chartwrap"><div class="grid" id="d-grid"></div></div>
        <div class="legend" id="d-legend" style="margin-top:8px"></div>
      </div>
    </div>
  </section>

  <section id="v-stats" class="panel" hidden>
    <div class="row" style="justify-content:space-between;align-items:center">
      <div class="label">Точность по спотам</div>
      <button class="ghost" id="st-reset">Сбросить</button>
    </div>
    <div id="st-body"></div>
  </section>
</div>

  return edgeCache[key][idx];
}
function rfiPool(pos){const s=SPOTS.find(x=>x.title==='RFI '+pos);return CELLS.map((_,i)=>s.freq.avg.open[i]/100)}
const poolCache={};
function pickHand(s,L,mode){
  let w=CELLS.map(h=>combos(h));
  if(s.pool){poolCache[s.pool]=poolCache[s.pool]||rfiPool(s.pool);w=w.map((x,i)=>x*poolCache[s.pool][i])}
  if(mode==='edge'){const w2=w.map((x,i)=>isEdge(s,L,i)?x:0);if(w2.some(x=>x>0))w=w2}
  const tot=w.reduce((a,b)=>a+b,0);let r=Math.random()*tot;
  for(let i=0;i<w.length;i++){r-=w[i];if(r<=0)return i}
  return w.length-1;
}
function suitsFor(h){
  const S=['s','h','d','c'];const a=S[Math.floor(Math.random()*4)];
  if(h.length===3&&h[2]==='s')return[a,a];
  let b;do{b=S[Math.floor(Math.random()*4)]}while(b===a);return[a,b];
}
const SYM={s:'♠',h:'♥',d:'♦',c:'♣'};

/* setup */
function renderLayer(){document.querySelectorAll('#layer button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===set.layer))}
function renderMode(){document.querySelectorAll('#mode button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===set.mode))}
function renderGroups(){
  const box=$('groups');box.innerHTML='';
  GROUPS.forEach((g,gi)=>{
    const ss=SPOTS.filter(s=>s.group===g), on=ss.filter(s=>set.sel.includes(s.id)).length;
    const d=document.createElement('div');d.className='grp';
    d.innerHTML=`<div class="grow"><label><input type="checkbox" id="g${gi}"><span>${g}</span></label><span class="cnt">${on}/${ss.length}</span><button class="exp" aria-expanded="${!!open[g]}">${open[g]?'Скрыть':'Список'}</button></div>`;
    const cb=d.querySelector('input');cb.checked=on===ss.length;cb.indeterminate=on>0&&on<ss.length;
    cb.onchange=()=>{ss.forEach(s=>{const i=set.sel.indexOf(s.id);if(cb.checked&&i<0)set.sel.push(s.id);if(!cb.checked&&i>=0)set.sel.splice(i,1)});save('set',set);renderGroups()};
    d.querySelector('.exp').onclick=()=>{open[g]=!open[g];save('open',open);renderGroups()};
    if(open[g]){
      const l=document.createElement('div');l.className='spots';
      ss.forEach(s=>{const lb=document.createElement('label');lb.innerHTML=`<input type="checkbox" id="c-${s.id}"><span>${s.title}</span>`;
        const c=lb.querySelector('input');c.checked=set.sel.includes(s.id);
        c.onchange=()=>{const i=set.sel.indexOf(s.id);if(c.checked&&i<0)set.sel.push(s.id);if(!c.checked&&i>=0)set.sel.splice(i,1);save('set',set);renderGroups()};
        l.appendChild(lb)});
      d.appendChild(l);
    }
    box.appendChild(d);
  });
  const ne=errs.filter(e=>set.sel.includes(e.s)).length;
  $('sel-hint').textContent=`Выбрано спотов: ${set.sel.length} из ${SPOTS.length}. Ошибок в повторе: ${ne}.`;
}
$('layer').onclick=e=>{const v=e.target.dataset.v;if(v){set.layer=v;save('set',set);renderLayer()}};
$('mode').onclick=e=>{const v=e.target.dataset.v;if(v){set.mode=v;save('set',set);renderMode()}};
$('all-on').onclick=()=>{set.sel=SPOTS.map(s=>s.id);save('set',set);renderGroups()};
$('all-off').onclick=()=>{set.sel=[];save('set',set);renderGroups()};

/* views */
function view(v){['setup','drill','stats'].forEach(x=>{$('v-'+x).hidden=x!==v;$('t-'+x).setAttribute('aria-pressed',x===v)});if(v==='stats')renderStats();if(v==='setup')renderGroups()}
$('t-setup').onclick=()=>view('setup');
$('t-drill').onclick=()=>{view('drill');if(!cur)deal()};
$('t-stats').onclick=()=>view('stats');
$('go').onclick=()=>{view('drill');deal()};

/* drill */
function deal(){
  $('d-verdict').hidden=true;$('d-foot').hidden=true;$('d-chart').hidden=true;
  if(!set.sel.length){showEmpty('Выбери хотя бы один спот на вкладке «Споты».');return}
  let s,idx,L=set.layer,fromErr=null;
  if(set.mode==='err'){
    const pool=errs.filter(e=>set.sel.includes(e.s)&&BY[e.s]);
    if(!pool.length){showEmpty('Ошибок в выбранных спотах нет. Переключи режим раздачи или выбери другие споты.');return}
    fromErr=pool[Math.floor(Math.random()*pool.length)];s=BY[fromErr.s];idx=fromErr.h;L=fromErr.l;
  }else{
    s=BY[set.sel[Math.floor(Math.random()*set.sel.length)]];idx=pickHand(s,L,set.mode);
  }
  const h=CELLS[idx];cur={s,idx,L,h,fromErr,answered:false};
  $('d-group').textContent=s.group;$('d-title').textContent=s.title;
  const chips=[];if(s.layered)chips.push(`<span class="chip layer">${LNAME[L]}</span>`);
  if(s.pool)chips.push(`<span class="chip">руки из опена ${s.pool}</span>`);
  if(s.note)chips.push(`<span class="chip">${s.note}</span>`);
  if(fromErr)chips.push(`<span class="chip">повтор ошибки</span>`);
  $('d-chips').innerHTML=chips.join('');
  const [a,b]=suitsFor(h);
  $('d-hand').innerHTML=[[h[0],a],[h[1],b]].map(([r,su])=>`<div class="card c-${su}"><span class="r">${r==='T'?'10':r}</span><span class="su">${SYM[su]}</span></div>`).join('');
  $('d-hname').textContent=h;
  const acts=ORDER.filter(k=>s.actions.includes(k));
  $('d-acts').innerHTML=acts.map(k=>`<button class="act" data-k="${k}">${ACT[k][0]}</button>`).join('');
  $('d-acts').querySelectorAll('.act').forEach(btn=>btn.onclick=()=>answer(btn.dataset.k,btn));
}
function showEmpty(t){cur=null;$('d-group').textContent='';$('d-title').textContent=t;$('d-chips').innerHTML='';$('d-hand').innerHTML='';$('d-hname').textContent='';$('d-acts').innerHTML=''}
function answer(k,btn){
  if(!cur||cur.answered)return;cur.answered=true;
  const fr=freqs(cur.s,cur.L,cur.idx), b=best(fr), mx=fr[b], f=fr[k];
  let cls,txt;
  if(f>=mx-0.5){cls='ok';txt=mx<100?`Верно. Основное действие, частота ${f}%`:'Верно'}
  else if(f>=25){cls='mix';txt=`Допустимо: микс ${f}%. Основное действие - ${ACT[b][0].toLowerCase()} ${mx}%`}
  else{cls='bad';txt=`Ошибка. Правильно: ${ACT[b][0].toLowerCase()}${mx<100?' '+mx+'%':''}`}
  const good=cls!=='bad';
  sess.n++;if(good){sess.ok++;sess.streak++}else sess.streak=0;
  const key=cur.s.id+'|'+(cur.s.layered?cur.L:'avg');stats[key]=stats[key]||[0,0];stats[key][0]++;if(good)stats[key][1]++;save('stats',stats);
  const ei=errs.findIndex(e=>e.s===cur.s.id&&e.h===cur.idx&&e.l===cur.L);
  if(!good&&ei<0){errs.push({s:cur.s.id,h:cur.idx,l:cur.L});if(errs.length>400)errs.shift()}
  if(good&&ei>=0&&cls==='ok')errs.splice(ei,1);
  save('errs',errs);
  $('sc-n').textContent=sess.n;$('sc-a').textContent=Math.round(sess.ok/sess.n*100)+'%';$('sc-s').textContent=sess.streak;
  $('d-acts').querySelectorAll('.act').forEach(x=>{x.disabled=true;if(x===btn)x.classList.add('picked')});
  $('d-vt').className='vt '+cls;$('d-vt').textContent=txt;
  const acts=ORDER.filter(x=>cur.s.actions.includes(x));
  $('d-bars').innerHTML=acts.map(a=>`<div class="bar"><span>${ACT[a][0]}</span><span class="t"><i style="width:${fr[a]}%;background:${COL[a]}"></i></span><span class="p">${fr[a]}%</span></div>`).join('');
  $('d-verdict').hidden=false;$('d-foot').hidden=false;
  if(!$('d-chart').hidden||cls==='bad')drawChart(); else $('d-chart').hidden=true;
}
function drawChart(){
  if(!cur)return;const s=cur.s,L=cur.L;
  const acts=ORDER.filter(x=>s.actions.includes(x));
  $('d-grid').innerHTML=CELLS.map((h,i)=>{
    const fr=freqs(s,L,i);let stops=[],p=0;
    acts.forEach(a=>{if(fr[a]>0){stops.push(`${COL[a]} ${p}% ${p+fr[a]}%`);p+=fr[a]}});
    const bg=stops.length===1?stops[0].split(' ')[0]:`linear-gradient(90deg,${stops.join(',')})`;
    return `<div class="cell${i===cur.idx?' cur':''}" style="background:${bg}">${h}</div>`;
  }).join('');
  $('d-legend').innerHTML=acts.map(a=>`<span><i style="background:${COL[a]}"></i>${ACT[a][0]}</span>`).join('')+(s.layered?`<span>${LNAME[L]}</span>`:'');
  $('d-chart').hidden=false;
}
$('d-chart-btn').onclick=()=>{if($('d-chart').hidden)drawChart();else $('d-chart').hidden=true};
$('d-next').onclick=deal;
document.addEventListener('keydown',e=>{
  if($('v-drill').hidden||!cur)return;
  if(cur.answered&&(e.key===' '||e.key==='Enter')){e.preventDefault();deal();return}
  const n=parseInt(e.key,10);if(!cur.answered&&n>=1){const b=$('d-acts').querySelectorAll('.act')[n-1];if(b)b.click()}
});

/* stats */
function renderStats(){
  const body=$('st-body');const rows=[];
  GROUPS.forEach(g=>{
    const items=[];
    SPOTS.filter(s=>s.group===g).forEach(s=>['agro','avg','pas'].forEach(L=>{const st=stats[s.id+'|'+L];if(st)items.push([s.title+(s.layered?` · ${LNAME[L]}`:''),st])}));
    if(items.length){rows.push(`<h3>${g}</h3>`);items.forEach(([t,[n,ok]])=>{const a=Math.round(ok/n*100);
      const c=a>=90?'var(--good)':a>=75?'var(--mix)':'var(--bad)';
      rows.push(`<span>${t}</span><span class="n">${n}</span><span class="a" style="color:${c}">${a}%</span>`)})}
  });
  body.innerHTML=rows.length?`<div class="st">${rows.join('')}</div>`:'<p class="empty">Пока пусто. Статистика появится после первых раздач.</p>';
}
$('st-reset').onclick=()=>{
  const b=$('st-reset');
  if(b.dataset.confirm){stats={};errs=[];save('stats',stats);save('errs',errs);b.textContent='Сбросить';delete b.dataset.confirm;renderStats()}
  else{b.dataset.confirm='1';b.textContent='Точно сбросить?';setTimeout(()=>{b.textContent='Сбросить';delete b.dataset.confirm},3000)}
};

renderLayer();renderMode();renderGroups();
})();
</script>

<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
