<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Coin Drill">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head><body>
<title>Coin Drill</title>

<style>
/* Layout: one narrow column; settings, drill card, charts and stats as tabs; big thumb-reach buttons */
:root{
  --bg:#f2f3ef; --surface:#ffffff; --sunk:#e8eae4; --ink:#17201b; --muted:#5d6861; --line:#d6dad2;
  --accent:#1d6b58; --accent-ink:#ffffff; --accent-soft:#dcebe5;
  --raise:#c4473d; --allin:#7a3f9e; --call:#2c8a55; --fold:#8b948e;
  --good:#2c8a55; --mix:#b07a1c; --bad:#c4473d;
  --l-agro:#c4473d; --l-avg:#b8860b; --l-pas:#2c8a55;
  --card:#fbfbf8; --card-edge:#cfd3cb; --s:#151515; --h:#c62f2a; --d:#1f5ec0; --c:#2a8a3c;
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --num: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1311; --surface:#171d1a; --sunk:#202723; --ink:#e7ece8; --muted:#97a29b; --line:#2b3430;
  --accent:#4dbb99; --accent-ink:#08130f; --accent-soft:#1d3a31;
  --raise:#e06459; --allin:#a879c8; --call:#4bb27a; --fold:#68736c;
  --good:#4bb27a; --mix:#d9a441; --bad:#e06459;
  --l-agro:#e06459; --l-avg:#d9a441; --l-pas:#4bb27a;
  --card:#f1f1ec; --card-edge:#3a4440; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1311; --surface:#171d1a; --sunk:#202723; --ink:#e7ece8; --muted:#97a29b; --line:#2b3430;
  --accent:#4dbb99; --accent-ink:#08130f; --accent-soft:#1d3a31;
  --raise:#e06459; --allin:#a879c8; --call:#4bb27a; --fold:#68736c;
  --good:#4bb27a; --mix:#d9a441; --bad:#e06459;
  --l-agro:#e06459; --l-avg:#d9a441; --l-pas:#4bb27a;
  --card:#f1f1ec; --card-edge:#3a4440; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-block:14px 28px;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand small{font-weight:500;font-size:12px;color:var(--muted);margin-left:6px}
.clock{font-family:var(--num);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
button{font:inherit;color:inherit;cursor:pointer}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 4px;font-size:13px}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:5px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg.wrap3{grid-auto-flow:row;grid-template-columns:repeat(3,1fr)}
.seg button{border:0;background:transparent;border-radius:8px;padding:8px 2px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button:disabled{opacity:.4}
.sub{font-size:12px;color:var(--muted);margin-top:5px}
.daily{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border-radius:12px;padding:12px}
.daily div{flex:1;min-width:0}
.daily b{display:block;font-size:15px}
.daily span{font-size:12px;color:var(--muted)}
.daily button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 14px;font-weight:700;flex:none}
.groups{display:flex;flex-direction:column}
.grp{border-top:1px solid var(--line)}
.grp:first-child{border-top:0}
.grow{display:flex;align-items:center;gap:10px;padding:10px 0}
.grow label{flex:1;display:flex;align-items:center;gap:10px;font-weight:600;min-width:0}
.cnt{font-family:var(--num);font-size:12px;color:var(--muted)}
.exp{border:0;background:transparent;color:var(--muted);font-size:13px;padding:4px 6px}
.spots{display:flex;flex-direction:column;gap:2px;padding:0 0 10px 30px}
.srow{display:flex;align-items:center;gap:8px}
.spots label{flex:1;display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:4px 0;min-width:0}
.spots label span{min-width:0}
.mini{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:3px 8px;font-size:12px;color:var(--muted);flex:none}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none;margin-top:1px}
select{font:inherit;font-size:14px;color:var(--ink);background:var(--sunk);border:0;border-radius:10px;padding:10px;width:100%;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.primary{border:0;background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:14px;font-weight:700;font-size:16px;width:100%}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:13px}
.hint{font-size:13px;color:var(--muted);margin:0}
/* drill */
.focus{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--sunk);border-radius:10px;padding:8px 10px;font-size:13px}
.focus span{min-width:0;font-weight:600}
.focus .ghost{padding:5px 10px;flex:none}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--accent)}
.score{display:flex;gap:6px 14px;flex-wrap:wrap;font-family:var(--num);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.score b{color:var(--ink);font-weight:600}
.spot{display:flex;flex-direction:column;gap:4px}
.spot .g{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.spot h2{margin:0;font-size:20px;line-height:1.2;text-wrap:balance}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.chip.layer{color:#fff;font-weight:700;font-size:13px;padding:4px 10px}
.chip.layer.agro{background:var(--l-agro)} .chip.layer.avg{background:var(--l-avg)} .chip.layer.pas{background:var(--l-pas)}
.chip.peek{background:var(--mix);color:#fff}
.chip.new{background:var(--accent-soft);color:var(--ink)}
.hand{display:flex;justify-content:center;align-items:center;gap:10px;padding:12px 0 4px}
.card{width:84px;height:118px;border-radius:10px;background:var(--card);border:1px solid var(--card-edge);
  box-shadow:0 2px 6px rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.card .r{font-size:44px;font-weight:700;line-height:1}
.card .su{font-size:30px;line-height:1}
.c-s{color:var(--s)} .c-h{color:var(--h)} .c-d{color:var(--d)} .c-c{color:var(--c)}
.handname{text-align:center;font-family:var(--num);font-size:13px;color:var(--muted)}
.question{text-align:center;font-size:19px;font-weight:700;padding:18px 0 6px;text-wrap:balance}
.question small{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:4px}
.timer{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left}
.timer.low i{background:var(--bad)}
.acts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(88px,1fr))}
.act{border:0;border-radius:12px;padding:16px 8px;font-weight:700;font-size:16px;color:#fff}
.act[data-k="fold"]{background:var(--fold)} .act[data-k="call"],.act[data-k="cont"]{background:var(--call)}
.act[data-k="3bet"],.act[data-k="4bet"],.act[data-k="open"]{background:var(--raise)} .act[data-k="4bai"]{background:var(--allin)}
.act.opt{background:var(--ink);color:var(--bg);font-family:var(--num)}
.act.opt.right{background:var(--good);color:#fff}
.act:disabled{opacity:.45}
.act.picked{outline:3px solid var(--ink);outline-offset:2px;opacity:1}
.verdict{display:flex;flex-direction:column;gap:8px}
.vt{font-weight:700;font-size:17px}
.vt.ok{color:var(--good)} .vt.mix{color:var(--mix)} .vt.bad{color:var(--bad)}
.bars{display:flex;flex-direction:column;gap:5px}
.bar{display:grid;grid-template-columns:96px 1fr 42px;gap:8px;align-items:center;font-size:13px}
.bar .t{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.bar .t i{display:block;height:100%}
.bar .p{font-family:var(--num);text-align:right}
.famrow{display:flex;gap:3px;flex-wrap:wrap}
.famrow span{font-family:var(--num);font-size:11px;color:#fff;padding:4px 5px;border-radius:4px;text-shadow:0 0 2px rgba(0,0,0,.5)}
.famrow span.ans{outline:2px solid var(--ink);outline-offset:1px}
.foot{display:flex;gap:8px}
.foot .ghost{flex:1}
.foot .primary{flex:2}
.done{display:flex;flex-direction:column;gap:6px;text-align:center;padding:18px 0}
.done b{font-size:20px}
.chartwrap{overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:300px}
.cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:9px;font-family:var(--num);color:#fff;
  text-shadow:0 0 2px rgba(0,0,0,.6);border:0;padding:0}
.cell.cur{outline:2px solid var(--ink);outline-offset:-2px;position:relative;z-index:1}
.cell.chg{box-shadow:inset 0 0 0 2px var(--ink)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.cellinfo{font-size:13px;min-height:1.4em}
.cellinfo b{font-family:var(--num)}
/* stats */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--sunk);border-radius:10px;padding:10px}
.tile .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-family:var(--num);font-size:18px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.spark{display:flex;flex-direction:column;gap:4px}
.spark .h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.spark .h b{color:var(--ink);font-family:var(--num)}
.spark svg{width:100%;height:70px;display:block}
.sess{display:flex;flex-direction:column}
.sess div{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.sess div:first-child{border-top:0}
.sess .d{font-weight:600}
.sess .m{font-family:var(--num);color:var(--muted);text-align:right}
.sess .gs{grid-column:1/-1;font-size:12px;color:var(--muted)}
.st{display:grid;grid-template-columns:1fr auto auto auto;gap:6px 12px;font-size:13px;align-items:center}
.st .n,.st .tm{font-family:var(--num);color:var(--muted);text-align:right}
.st .a{font-family:var(--num);font-weight:600;text-align:right;min-width:40px}
.st h3{grid-column:1/-1;margin:10px 0 0;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.st .hd{font-size:11px;color:var(--muted);text-align:right}
.empty{color:var(--muted);font-size:14px;margin:0}
details summary{cursor:pointer;font-size:13px;color:var(--muted);padding:4px 0}
@media (prefers-reduced-motion:no-preference){.card{animation:deal .18s ease-out}@keyframes deal{from{transform:translateY(6px);opacity:.3}}}
</style>

<div class="wrap">
  <header>
    <div class="top">
      <div class="brand">Coin Drill<small>CoinPoker, анте 0.25</small></div>
      <div class="clock" id="clock" title="Время этой сессии">00:00</div>
    </div>
    <nav>
      <button class="tab" id="t-setup" aria-pressed="true">Споты</button>
      <button class="tab" id="t-drill" aria-pressed="false">Трен</button>
      <button class="tab" id="t-charts" aria-pressed="false">Чарты</button>
      <button class="tab" id="t-stats" aria-pressed="false">Стата</button>
    </nav>
  </header>

  <section id="v-setup" class="panel">
    <div class="daily">
      <div><b>Ежедневка</b><span id="daily-sub"></span></div>
      <button id="daily-go">Начать</button>
    </div>
    <div>
      <div class="label">Режим</div>
      <div class="seg wrap3" id="mode">
        <button data-v="all" aria-pressed="false">Все руки</button>
        <button data-v="edge" aria-pressed="true">Пограничные</button>
        <button data-v="chg" aria-pressed="false">Изменения</button>
        <button data-v="err" aria-pressed="false">Повтор</button>
        <button data-v="bnd" aria-pressed="false">Границы</button>
      </div>
      <div class="sub" id="mode-sub"></div>
    </div>
    <div>
      <div class="label">Против кого</div>
      <div class="seg" id="layer">
        <button data-v="agro" aria-pressed="false">Агро</button>
        <button data-v="avg" aria-pressed="true">Средние</button>
        <button data-v="pas" aria-pressed="false">Пассив</button>
        <button data-v="mix" aria-pressed="false">Микс</button>
      </div>
      <div class="sub" id="layer-sub"></div>
    </div>
    <div>
      <div class="label">Как часто какой спот</div>
      <div class="seg" id="freq">
        <button data-v="game" aria-pressed="true">Как в игре</button>
        <button data-v="flat" aria-pressed="false">Поровну</button>
      </div>
      <div class="sub" id="freq-sub"></div>
    </div>
    <div>
      <div class="label">Время на решение</div>
      <div class="seg" id="speed">
        <button data-v="0" aria-pressed="true">Без лимита</button>
        <button data-v="5" aria-pressed="false">5 с</button>
        <button data-v="4" aria-pressed="false">4 с</button>
        <button data-v="3" aria-pressed="false">3 с</button>
      </div>
    </div>
    <div>
      <div class="label">Миксы</div>
      <div class="seg" id="mixes">
        <button data-v="easy" aria-pressed="true">Любое от 40%</button>
        <button data-v="strict" aria-pressed="false">Только основное</button>
      </div>
      <div class="sub" id="mixes-sub"></div>
    </div>
    <div class="row" style="justify-content:space-between;align-items:center">
      <div class="label" style="margin:0">Споты</div>
      <div class="row"><button class="ghost" id="all-on">Все</button><button class="ghost" id="all-off">Снять</button></div>
    </div>
    <div class="groups" id="groups"></div>
    <button class="primary" id="go">Начать</button>
    <p class="hint" id="sel-hint"></p>
  </section>

  <section id="v-drill" hidden>
    <div class="panel">
      <div class="focus" id="d-focus" hidden><div style="flex:1;min-width:0"><span id="d-focus-t"></span><div class="prog" id="d-prog" hidden><i id="d-prog-bar"></i></div></div><button class="ghost" id="d-focus-x">Все споты</button></div>
      <div class="score"><span>Раздач <b id="sc-n">0</b></span><span>Точность <b id="sc-a">-</b></span><span>Серия <b id="sc-s">0</b></span><span>Решение <b id="sc-t">-</b></span></div>
      <div id="d-main">
        <div class="spot">
          <span class="g" id="d-group"></span>
          <h2 id="d-title"></h2>
          <div class="chips" id="d-chips"></div>
        </div>
        <div class="hand" id="d-hand"></div>
        <div class="handname" id="d-hname"></div>
      </div>
      <div class="timer" id="d-timer" hidden><i id="d-timer-bar"></i></div>
      <div class="acts" id="d-acts"></div>
      <div class="verdict" id="d-verdict" hidden>
        <div class="vt" id="d-vt"></div>
        <div class="bars" id="d-bars"></div>
      </div>
      <div class="foot" id="d-foot">
        <button class="ghost" id="d-chart-btn">Чарт</button>
        <button class="primary" id="d-next" hidden>Дальше</button>
      </div>
      <div id="d-chart" hidden>
        <div class="chartwrap"><div class="grid" id="d-grid"></div></div>
        <div class="legend" id="d-legend" style="margin-top:8px"></div>
      </div>
    </div>
  </section>

  <section id="v-charts" class="panel" hidden>
    <div>
      <div class="label">Группа</div>
      <select id="c-group"></select>
    </div>
    <div>
      <div class="label">Спот</div>
      <select id="c-spot"></select>
    </div>
    <div>
      <div class="label">Против кого</div>
      <div class="seg" id="c-layer">
        <button data-v="agro" aria-pressed="false">Агро</button>
        <button data-v="avg" aria-pressed="true">Средние</button>
        <button data-v="pas" aria-pressed="false">Пассив</button>
      </div>
    </div>
    <div class="bars" id="c-sum"></div>
    <div class="chartwrap"><div class="grid" id="c-grid"></div></div>
    <div class="legend" id="c-legend"></div>
    <div class="cellinfo" id="c-info">Нажми на руку, чтобы увидеть частоты.</div>
    <p class="hint" id="c-note"></p>
    <div class="foot">
      <button class="ghost" id="c-train-group">Тренить группу</button>
      <button class="primary" id="c-train">Тренить этот спот</button>
    </div>
  </section>

  <section id="v-stats" class="panel" hidden>
    <div class="tiles">
      <div class="tile"><div class="k">Сессия</div><div class="v" id="tm-sess">0:00</div></div>
      <div class="tile"><div class="k">Сегодня</div><div class="v" id="tm-day">0:00</div></div>
      <div class="tile"><div class="k">7 дней</div><div class="v" id="tm-week">0:00</div></div>
    </div>
    <div id="cards-info" class="hint"></div>
    <div id="sess-charts"></div>
    <div id="sess-list"></div>
    <div id="slow"></div>
    <div class="row" style="justify-content:space-between;align-items:center">
      <div class="label" style="margin:0">Точность по спотам</div>
      <button class="ghost" id="st-reset">Сбросить</button>
    </div>
    <div id="st-body"></div>
  </section>

const $=id=>document.getElementById(id);

function combos(h){return h.length===2?6:(h[2]==='s'?4:12)}
function LL(s,L){return s.layered?L:'avg'}
function freqs(s,L,idx){
  const f=s.freq[LL(s,L)], out={}; let sum=0;
  s.actions.forEach(a=>{if(a!=='fold'){out[a]=f[a][idx];sum+=f[a][idx]}});
  out.fold=Math.max(0,100-sum); return out;
}
function best(fr){let b=null;for(const k in fr){if(b===null||fr[k]>fr[b])b=k}return b}
const edgeCache={};
function isEdge(s,L,idx){
  const key=s.id+'|'+LL(s,L);
  if(!edgeCache[key]){
    const bests=CELLS.map((_,i)=>{const fr=freqs(s,L,i);return [best(fr),Math.max(...Object.values(fr))]});
    edgeCache[key]=bests.map((b,i)=>{
      if(b[1]<100)return true;
      const r=Math.floor(i/13),c=i%13;
      return [[r-1,c],[r+1,c],[r,c-1],[r,c+1]].some(([y,x])=>y>=0&&y<13&&x>=0&&x<13&&bests[y*13+x][0]!==b[0]);
    });
  }
  return edgeCache[key][idx];
}
function chgSet(s,L){return s.chg&&s.chg[LL(s,L)]}
function chgLayers(s){if(s.isnew)return s.layered?LAYERS:['avg'];if(!s.chg)return[];return Object.keys(s.chg)}
const poolCache={};
function rfiPool(pos){const s=SPOTS.find(x=>x.title==='RFI '+pos);return CELLS.map((_,i)=>s.freq.avg.open[i]/100)}
function poolW(s){let w=CELLS.map(h=>combos(h));if(s.pool){poolCache[s.pool]=poolCache[s.pool]||rfiPool(s.pool);w=w.map((x,i)=>x*poolCache[s.pool][i])}return w}
function pickHand(s,L,mode){
  let w=poolW(s);
  if(mode==='chg'&&chgSet(s,L)){const c=new Set(chgSet(s,L));const w2=w.map((x,i)=>c.has(i)?Math.max(x,1):0);if(w2.some(x=>x>0))w=w2}
  else if(mode==='edge'||mode==='chg'){const w2=w.map((x,i)=>isEdge(s,L,i)?x:0);if(w2.some(x=>x>0))w=w2}
  return wpick(w);
}
function wpick(w){const tot=w.reduce((a,b)=>a+b,0);let r=Math.random()*tot;for(let i=0;i<w.length;i++){r-=w[i];if(r<=0)return i}return w.length-1}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function suitsFor(h){
  const S=['s','h','d','c'];const a=rnd(S);
  if(h.length===3&&h[2]==='s')return[a,a];
  let b;do{b=rnd(S)}while(b===a);return[a,b];
}
const SYM={s:'♠',h:'♥',d:'♦',c:'♣'};
function fmt(sec){sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;
  return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function fmtH(sec){const h=Math.floor(sec/3600),m=Math.round(sec%3600/60);return h?`${h}ч ${m}м`:`${m}м`}
function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function inWhen(ms){if(ms<=0)return'сейчас';const m=Math.round(ms/60e3);if(m<60)return`через ${m} мин`;const h=Math.round(m/60);if(h<36)return`через ${h} ч`;return`через ${Math.round(h/24)} дн`}

/* boundary questions */
const FAMS=[];
FAMS.push(['пару',R.split('').map(r=>r+r)]);
['A','K','Q','J','T'].forEach(x=>FAMS.push([x+'xs',R.slice(R.indexOf(x)+1).split('').map(y=>x+y+'s')]));
['A','K','Q','J'].forEach(x=>FAMS.push([x+'xo',R.slice(R.indexOf(x)+1).split('').map(y=>x+y+'o')]));
const bndCache={};
function actWord(s){if(s.actions.includes('open'))return'опенишь';if(s.actions.length===2&&s.actions[0]==='3bet')return'3-бетишь';return'играешь (не фолд)'}
function bndQs(s,L){
  const key=s.id+'|'+LL(s,L);if(bndCache[key])return bndCache[key];
  const pool=poolW(s),out=[];
  FAMS.forEach(([name,hands])=>{
    const ix=hands.map(h=>CELLS.indexOf(h));
    if(s.pool&&pool[ix[0]]===0)return;
    const inn=ix.map(i=>freqs(s,L,i).fold<50&&pool[i]>0);
    let k=0;while(k<inn.length&&inn[k])k++;
    if(k===0||!inn.slice(k).every(x=>!x))return;
    out.push({name,hands,ix,ans:k-1});
  });
  return bndCache[key]=out;
}

function bindSeg(id,key,num){$(id).onclick=e=>{const v=e.target.dataset.v;if(v===undefined)return;set[key]=num?Number(v):v;save('set',set);syncSetup()}}
bindSeg('layer','layer');bindSeg('mode','mode');bindSeg('freq','freq');bindSeg('speed','speed',true);bindSeg('mixes','mixes');
const MODESUB={all:'Любые руки из выбранных спотов.',edge:'Миксы и руки на границе диапазона.',
  chg:'Только руки, которые мы поменяли: новые слои RFI и защиты BB, 3-беты под поле. Плюс новые споты против 3-бета.',

function dueCards(ids){const now=Date.now();return cards.filter(c=>c.due<=now&&(!ids||ids.includes(c.s)))}

  $('daily-sub').textContent=(d&&d.done?`Сегодня сделана: ${d.ok}/${d.n}. Можно ещё раз. `:`${DAILY_N} решений, около 5 минут. `)+`К повтору: ${due}.`;
}
function renderGroups(){
  const box=$('groups');box.innerHTML='';

        c.onchange=()=>{const i=set.sel.indexOf(s.id);if(c.checked&&i<0)set.sel.push(s.id);if(!c.checked&&i>=0)set.sel.splice(i,1);save('set',set);renderGroups()};
        row.querySelector('.mini').onclick=()=>{cv.g=s.group;cv.s=s.id;if(set.layer!=='mix')cv.l=set.layer;save('cv',cv);view('charts')};

$('all-off').onclick=()=>{set.sel=[];save('set',set);renderGroups()};

/* daily */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function buildDaily(){
  const ids=set.sel.length?set.sel:SPOTS.map(s=>s.id);
  const q=shuffle(dueCards(ids)).slice(0,25).map(c=>({t:'card',s:c.s,h:c.h,l:c.l}));
  const cand=[];
  ids.forEach(id=>{const s=BY[id];(s.layered?LAYERS:['avg']).forEach(L=>{
    const st=stats[id+'|'+L],n=st?st[0]:0,changed=!!chgSet(s,L)||!!s.isnew;
    let sc=n<5?(changed?0.55:0.8):st[1]/st[0];if(changed)sc-=0.1;
    cand.push({s:id,l:L,sc:sc-Math.log10(1+(s.w||1))*0.05});
  })});
  cand.sort((a,b)=>a.sc-b.sc);
  const top=cand.slice(0,8);let i=0;
  while(q.length<DAILY_N&&top.length){q.push({t:'hand',s:top[i%top.length].s,l:top[i%top.length].l});i++}
  return shuffle(q);
}
$('daily-go').onclick=()=>{focus=null;daily={q:buildDaily(),i:0,n:0,ok:0,sec0:sess.sec};view('drill');deal()};
function finishDaily(){
  const d=daily,acc=d.n?Math.round(d.ok/d.n*100):0,sec=sess.sec-d.sec0;
  dailyLog[dayKey()]={done:true,n:d.n,ok:d.ok,sec};save('dailylog',dailyLog);
  daily=null;cur=null;stopTimer();
  $('d-focus').hidden=true;$('d-acts').innerHTML='';$('d-verdict').hidden=true;$('d-next').hidden=true;$('d-chart').hidden=true;$('d-chart-btn').hidden=true;
  $('d-main').innerHTML=`<div class="done"><b>Ежедневка готова</b><span>${d.n} решений · точность ${acc}% · ${fmt(sec)}</span><span class="hint">К повтору осталось: ${dueCards().length}</span></div>`;
  $('d-main').dataset.done='1';
}
function restoreMain(){
  if(!$('d-main').dataset.done)return;delete $('d-main').dataset.done;
  $('d-main').innerHTML=`<div class="spot"><span class="g" id="d-group"></span><h2 id="d-title"></h2><div class="chips" id="d-chips"></div></div><div class="hand" id="d-hand"></div><div class="handname" id="d-hname"></div>`;
}

/* session clock: counts while you acted in the last 90 s */
let lastAct=Date.now(), unsaved=0;
function touch(){lastAct=Date.now()}
document.addEventListener('pointerdown',touch,{passive:true});
setInterval(()=>{
  if(document.hidden||Date.now()-lastAct>90000)return;
  sess.sec++;unsaved++;const k=dayKey();times[k]=(times[k]||0)+1;
  if(curSession&&Date.now()-curSession.last<600000)curSession.sec++;
  $('clock').textContent=fmt(sess.sec);
  if(unsaved>=10){save('times',times);save('sessions',sessions);unsaved=0}
  if(curView==='stats')renderTimes();
},1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden){save('times',times);save('sessions',sessions);unsaved=0}else touch()});
function sessionHit(good,ms,group){
  const now=Date.now();
  if(!curSession||now-curSession.last>600000){curSession={start:now,last:now,sec:0,n:0,ok:0,ms:0,tn:0,g:{}};sessions.push(curSession);if(sessions.length>120)sessions.shift()}
  curSession.last=now;curSession.n++;if(good)curSession.ok++;if(ms!=null){curSession.ms+=Math.round(ms);curSession.tn++}
  curSession.g[group]=(curSession.g[group]||0)+1;save('sessions',sessions);
}

/* drill */
function chooseSpot(ids){
  if(set.freq==='game')return BY[ids[wpick(ids.map(id=>BY[id].w||1))]];
  return BY[rnd(ids)];
}
function layerFor(s,pref){
  if(!s.layered)return'avg';
  if(pref==='mix')return rnd(LAYERS);
  return pref;
}
function deal(){
  restoreMain();stopTimer();
  $('d-verdict').hidden=true;$('d-next').hidden=true;$('d-chart').hidden=true;$('d-chart-btn').hidden=false;
  // banner
  if(daily){$('d-focus').hidden=false;$('d-focus-t').textContent=`Ежедневка: ${daily.i}/${daily.q.length}`;$('d-prog').hidden=false;$('d-prog-bar').style.width=(daily.i/daily.q.length*100)+'%';$('d-focus-x').textContent='Выйти'}
  else if(focus){$('d-focus').hidden=false;$('d-focus-t').textContent='Фокус: '+focus.label;$('d-prog').hidden=true;$('d-focus-x').textContent='Все споты'}
  else $('d-focus').hidden=true;
  if(daily&&daily.i>=daily.q.length){finishDaily();return}
  const ids=focus?focus.ids:set.sel;
  if(!daily&&!ids.length){showEmpty('Выбери хотя бы один спот на вкладке «Споты».');return}
  if(!daily&&set.mode==='bnd'){dealBnd(ids,focus?focus.layer:set.layer);return}
  let s,idx,L,fromCard=false;
  if(daily){
    const t=daily.q[daily.i];s=BY[t.s];L=t.l;
    if(t.t==='card'){idx=t.h;fromCard=true}else idx=pickHand(s,L,chgSet(s,L)||s.isnew?'chg':'edge');
  }else if(focus){
    s=chooseSpot(ids);L=layerFor(s,focus.layer);
    idx=pickHand(s,L,set.mode==='err'?'edge':set.mode);
  }else if(set.mode==='err'){
    const pool=dueCards(ids);
    if(!pool.length){
      const later=cards.filter(c=>ids.includes(c.s)).sort((a,b)=>a.due-b.due);
      showEmpty(later.length?`Сейчас повторять нечего. В работе ${later.length} рук, ближайший повтор ${inWhen(later[0].due-Date.now())}.`:'Ошибок в выбранных спотах нет. Выбери другой режим.');return}
    const c=rnd(pool);s=BY[c.s];idx=c.h;L=c.l;fromCard=true;
  }else if(set.mode==='chg'){
    const cand=ids.map(id=>BY[id]).filter(s=>{const ls=chgLayers(s);return ls.length&&(set.layer==='mix'||!s.layered||ls.includes(set.layer))});
    if(!cand.length){showEmpty(`В выбранных спотах нет изменений для слоя «${LNAME[set.layer]||set.layer}». Попробуй «Средние» или «Микс».`);return}
    s=chooseSpot(cand.map(x=>x.id));
    const ls=chgLayers(s);L=!s.layered?'avg':(set.layer==='mix'?rnd(ls):set.layer);
    idx=pickHand(s,L,'chg');
  }else{
    s=chooseSpot(ids);L=layerFor(s,set.layer);idx=pickHand(s,L,set.mode);
  }
  L=LL(s,L);
  const h=CELLS[idx];cur={kind:'hand',s,idx,L,h,fromCard,answered:false,peek:false,t0:performance.now()};
  $('d-group').textContent=s.group;$('d-title').textContent=s.title;
  renderChips();
  const [a,b]=suitsFor(h);
  $('d-hand').innerHTML=[[h[0],a],[h[1],b]].map(([r,su])=>`<div class="card c-${su}"><span class="r">${r==='T'?'10':r}</span><span class="su">${SYM[su]}</span></div>`).join('');
  $('d-hname').textContent=h;
  const acts=ORDER.filter(k=>s.actions.includes(k));
  $('d-acts').innerHTML=acts.map(k=>`<button class="act" data-k="${k}">${ACT[k][0]}</button>`).join('');
  $('d-acts').querySelectorAll('.act').forEach(btn=>btn.onclick=()=>answer(btn.dataset.k,btn));
  if(set.speed&&!fromCard)startTimer(set.speed);
}
function dealBnd(ids,pref){
  const opts=[];
  ids.forEach(id=>{const s=BY[id];const ls=s.layered?(pref==='mix'?LAYERS:[pref]):['avg'];ls.forEach(L=>{const qs=bndQs(s,L);if(qs.length)opts.push({s,L,qs,w:s.w||1})})});
  if(!opts.length){showEmpty('Для выбранных спотов вопросов о границах нет.');return}
  const o=set.freq==='game'?opts[wpick(opts.map(x=>x.w))]:rnd(opts);
  const q=rnd(o.qs),n=q.hands.length;
  let lo=Math.max(0,q.ans-3),hi=Math.min(q.ans,n-4);if(hi<lo)hi=lo;
  const st=Math.max(0,Math.min(lo+Math.floor(Math.random()*(hi-lo+1)),Math.max(0,n-4)));
  const choices=q.hands.slice(st,st+4);
  cur={kind:'bnd',s:o.s,L:o.L,q,choices,answered:false,peek:false,t0:performance.now(),idx:-1};
  $('d-group').textContent=o.s.group;$('d-title').textContent=o.s.title;renderChips();
  $('d-hand').innerHTML=`<div class="question">Худшая ${q.name==='пару'?'пара':q.name}, которую ${actWord(o.s)}<small>выше неё по строке всё тоже играется</small></div>`;
  $('d-hname').textContent='';
  $('d-acts').innerHTML=choices.map(h=>`<button class="act opt" data-h="${h}">${h}</button>`).join('');
  $('d-acts').querySelectorAll('.act').forEach(btn=>btn.onclick=()=>answerBnd(btn.dataset.h,btn));
  if(set.speed)startTimer(set.speed+2);
}
function renderChips(){
  const s=cur.s,chips=[];
  if(s.layered)chips.push(`<span class="chip layer ${cur.L}">${LNAME[cur.L]}</span>`);
  if(cur.kind==='hand'&&chgSet(s,cur.L)&&chgSet(s,cur.L).includes(cur.idx))chips.push(`<span class="chip new">изменено</span>`);
  if(s.isnew)chips.push(`<span class="chip new">новый спот</span>`);
  if(s.pool)chips.push(`<span class="chip">руки из опена ${s.pool}</span>`);
  if(s.note)chips.push(`<span class="chip">${s.note}</span>`);
  if(cur.fromCard)chips.push(`<span class="chip">повтор</span>`);
  if(cur.peek)chips.push(`<span class="chip peek">подсмотрено, не в зачёт</span>`);
  $('d-chips').innerHTML=chips.join('');
}
function showEmpty(t){cur=null;$('d-group').textContent='';$('d-title').textContent=t;$('d-chips').innerHTML='';$('d-hand').innerHTML='';$('d-hname').textContent='';$('d-acts').innerHTML='';$('d-chart-btn').hidden=true}
function startTimer(sec){
  const bar=$('d-timer-bar'),box=$('d-timer');box.hidden=false;box.classList.remove('low');
  bar.style.transition='none';bar.style.transform='scaleX(1)';void bar.offsetWidth;
  bar.style.transition=`transform ${sec}s linear`;bar.style.transform='scaleX(0)';
  const lowAt=setTimeout(()=>box.classList.add('low'),sec*700);
  const end=setTimeout(()=>{if(cur&&!cur.answered){cur.kind==='bnd'?answerBnd('timeout',null):answer('timeout',null)}},sec*1000);
  timerId=[lowAt,end];
}
function stopTimer(freeze){
  if(timerId){timerId.forEach(clearTimeout);timerId=null}
  const bar=$('d-timer-bar');
  if(freeze){const m=getComputedStyle(bar).transform;bar.style.transition='none';bar.style.transform=m}
  else $('d-timer').hidden=true;
}
function judge(fr,k){
  const b=best(fr),mx=fr[b],f=k==='timeout'?0:fr[k];
  if(k==='timeout')return{cls:'bad',txt:`Время вышло. Правильно: ${ACT[b][0].toLowerCase()}${mx<100?' '+mx+'%':''}`};
  if(f>=mx-0.5)return{cls:'ok',txt:mx<100?`Верно. Основное действие, ${f}%`:'Верно'};
  if(set.mixes==='easy'&&f>=40)return{cls:'ok',txt:`Верно, микс ${f}%. Основное - ${ACT[b][0].toLowerCase()} ${mx}%`};
  if(set.mixes==='strict'&&f>=25)return{cls:'mix',txt:`Микс ${f}%. Основное действие - ${ACT[b][0].toLowerCase()} ${mx}%`};
  return{cls:'bad',txt:`Ошибка. Правильно: ${ACT[b][0].toLowerCase()}${mx<100?' '+mx+'%':''}`};
}
function record(key,good,ms,timedOut){
  const st=stats[key]||[0,0,0,0];while(st.length<4)st.push(0);
  st[0]++;if(good)st[1]++;if(!timedOut){st[2]+=Math.round(ms);st[3]++}
  stats[key]=st;save('stats',stats);
  sess.n++;if(good){sess.ok++;sess.streak++}else sess.streak=0;
  if(!timedOut){sess.ms+=ms;sess.tn++}
  sessionHit(good,timedOut?null:ms,cur.s.group);
  if(daily){daily.n++;if(good)daily.ok++}
  $('sc-n').textContent=sess.n;$('sc-a').textContent=Math.round(sess.ok/sess.n*100)+'%';$('sc-s').textContent=sess.streak;
  $('sc-t').textContent=sess.tn?(sess.ms/sess.tn/1000).toFixed(1)+' с':'-';
}
function updateCard(cls){
  const now=Date.now(),i=cards.findIndex(c=>c.s===cur.s.id&&c.h===cur.idx&&c.l===cur.L);
  if(cls==='bad'){
    if(i<0)cards.push({s:cur.s.id,h:cur.idx,l:cur.L,box:1,due:now+BOX[1]});
    else{cards[i].box=1;cards[i].due=now+BOX[1]}
    if(cards.length>600)cards.shift();
  }else if(cls==='ok'&&i>=0&&cards[i].due<=now){
    const b=cards[i].box+1;
    if(b>=BOX.length)cards.splice(i,1);else{cards[i].box=b;cards[i].due=now+BOX[b]}
  }
  save('cards',cards);
}
function finishAnswer(){
  if(daily){daily.i++;$('d-focus-t').textContent=`Ежедневка: ${daily.i}/${daily.q.length}`;$('d-prog-bar').style.width=(daily.i/daily.q.length*100)+'%'}
  $('d-verdict').hidden=false;$('d-next').hidden=false;
}
function answer(k,btn){
  if(!cur||cur.answered)return;cur.answered=true;
  const ms=performance.now()-cur.t0;stopTimer(true);
  const fr=freqs(cur.s,cur.L,cur.idx), {cls,txt}=judge(fr,k), good=cls!=='bad';
  if(!cur.peek){record(cur.s.id+'|'+cur.L,good,ms,k==='timeout');updateCard(cls)}
  $('d-acts').querySelectorAll('.act').forEach(x=>{x.disabled=true;if(x===btn)x.classList.add('picked')});
  $('d-vt').className='vt '+cls;$('d-vt').textContent=txt+(cur.peek?' (не в зачёт)':'');
  const acts=ORDER.filter(x=>cur.s.actions.includes(x));
  $('d-bars').innerHTML=acts.map(a=>`<div class="bar"><span>${ACT[a][0]}</span><span class="t"><i style="width:${fr[a]}%;background:${COL[a]}"></i></span><span class="p">${fr[a]}%</span></div>`).join('');
  finishAnswer();
  if(cls==='bad'||!$('d-chart').hidden)drawGrid($('d-grid'),$('d-legend'),cur.s,cur.L,cur.idx);
  if(cls==='bad')$('d-chart').hidden=false;
}
function answerBnd(h,btn){
  if(!cur||cur.answered)return;cur.answered=true;
  const ms=performance.now()-cur.t0;stopTimer(true);
  const q=cur.q,right=q.hands[q.ans],good=h===right;
  if(!cur.peek)record(cur.s.id+'|'+cur.L+'|b',good,ms,h==='timeout');
  $('d-acts').querySelectorAll('.act').forEach(x=>{x.disabled=true;if(x===btn)x.classList.add('picked');if(x.dataset.h===right)x.classList.add('right')});
  $('d-vt').className='vt '+(good?'ok':'bad');
  $('d-vt').textContent=(h==='timeout'?'Время вышло. ':good?'Верно. ':'Ошибка. ')+`Граница: ${right}`+(cur.peek?' (не в зачёт)':'');
  const acts=ORDER.filter(x=>cur.s.actions.includes(x));
  $('d-bars').innerHTML=`<div class="famrow">${q.ix.map((i,n)=>`<span class="${n===q.ans?'ans':''}" style="background:${cellBg(freqs(cur.s,cur.L,i),acts)}">${q.hands[n]}</span>`).join('')}</div>`;
  finishAnswer();
}
$('d-chart-btn').onclick=()=>{
  if(!cur)return;
  if(!$('d-chart').hidden){$('d-chart').hidden=true;return}
  if(!cur.answered&&!cur.peek){cur.peek=true;stopTimer(true);renderChips()}
  drawGrid($('d-grid'),$('d-legend'),cur.s,cur.L,cur.idx);$('d-chart').hidden=false;
};
$('d-next').onclick=deal;
document.addEventListener('keydown',e=>{
  if(curView!=='drill'||!cur)return;
  if(cur.answered&&(e.key===' '||e.key==='Enter')){e.preventDefault();deal();return}
  const n=parseInt(e.key,10);if(!cur.answered&&n>=1){const b=$('d-acts').querySelectorAll('.act')[n-1];if(b)b.click()}
});

/* chart grid */
function cellBg(fr,acts){
  let stops=[],p=0;acts.forEach(a=>{if(fr[a]>0){stops.push(`${COL[a]} ${p}% ${p+fr[a]}%`);p+=fr[a]}});
  return stops.length===1?stops[0].split(' ')[0]:`linear-gradient(90deg,${stops.join(',')})`;
}
function drawGrid(grid,legend,s,L,curIdx,onCell,showChg){
  const acts=ORDER.filter(x=>s.actions.includes(x)),ch=new Set(showChg?(chgSet(s,L)||[]):[]);
  grid.innerHTML=CELLS.map((h,i)=>`<button class="cell${i===curIdx?' cur':''}${ch.has(i)?' chg':''}" data-i="${i}" style="background:${cellBg(freqs(s,L,i),acts)}">${h}</button>`).join('');
  if(onCell)grid.querySelectorAll('.cell').forEach(c=>c.onclick=()=>onCell(Number(c.dataset.i)));
  legend.innerHTML=acts.map(a=>`<span><i style="background:${COL[a]}"></i>${ACT[a][0]}</span>`).join('')+(ch.size?'<span>рамка - изменено</span>':'')+(s.layered?`<span>${LNAME[L]}</span>`:'');
}

/* charts tab */
let cv=load('cv',{g:GROUPS[0],s:null,l:'avg'});
GROUPS.forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=g;$('c-group').appendChild(o)});
$('c-group').onchange=()=>{cv.g=$('c-group').value;cv.s=null;save('cv',cv);renderCharts()};
$('c-spot').onchange=()=>{cv.s=$('c-spot').value;save('cv',cv);renderCharts()};
$('c-layer').onclick=e=>{const v=e.target.dataset.v;if(!v||e.target.disabled)return;cv.l=v;save('cv',cv);renderCharts()};
function renderCharts(){
  if(!GROUPS.includes(cv.g))cv.g=GROUPS[0];
  $('c-group').value=cv.g;
  const ss=SPOTS.filter(s=>s.group===cv.g);
  if(!ss.find(s=>s.id===cv.s))cv.s=ss[0].id;
  $('c-spot').innerHTML=ss.map(s=>`<option value="${s.id}">${s.title}</option>`).join('');$('c-spot').value=cv.s;
  const s=BY[cv.s];
  document.querySelectorAll('#c-layer button').forEach(b=>{b.disabled=!s.layered;b.setAttribute('aria-pressed',String(s.layered?b.dataset.v===cv.l:b.dataset.v==='avg'))});
  const L=LL(s,cv.l), acts=ORDER.filter(x=>s.actions.includes(x));
  const pool=poolW(s),tot=pool.reduce((a,b)=>a+b,0),sum={};acts.forEach(a=>sum[a]=0);
  CELLS.forEach((h,i)=>{const fr=freqs(s,L,i);acts.forEach(a=>sum[a]+=pool[i]*fr[a]/100)});
  $('c-sum').innerHTML=acts.map(a=>{const p=(sum[a]/tot*100);return `<div class="bar"><span>${ACT[a][0]}</span><span class="t"><i style="width:${p}%;background:${COL[a]}"></i></span><span class="p">${p.toFixed(1)}%</span></div>`}).join('');
  drawGrid($('c-grid'),$('c-legend'),s,L,-1,i=>{
    const fr=freqs(s,L,i);
    $('c-info').innerHTML=`<b>${CELLS[i]}</b>: `+acts.filter(a=>fr[a]>0).map(a=>`${ACT[a][0].toLowerCase()} ${fr[a]}%`).join(', ');
    $('c-grid').querySelectorAll('.cell').forEach(c=>c.classList.toggle('cur',Number(c.dataset.i)===i));
  },true);
  $('c-info').textContent='Нажми на руку, чтобы увидеть частоты.';
  $('c-note').textContent=(s.pool?`Итоги посчитаны по рукам из опена ${s.pool}. `:'')+(s.note||'')+(s.isnew?' Новый спот.':'');
}

/* stats */
function renderTimes(){
  $('tm-sess').textContent=fmt(sess.sec);
  $('tm-day').textContent=fmtH(times[dayKey()]||0);
  let w=0;for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);w+=times[dayKey(d)]||0}
  $('tm-week').textContent=fmtH(w);
}
function title(key){const [id,L,b]=key.split('|'),s=BY[id];return s?s.title+(s.layered?` · ${LNAME[L]}`:'')+(b?' · границы':''):null}
function spark(vals,lab,fmtv,lowGood){
  if(vals.length<2)return'';
  const W=300,H=64,P=6,mn=Math.min(...vals),mx=Math.max(...vals),rg=(mx-mn)||1;
  const pts=vals.map((v,i)=>[P+i*(W-2*P)/(vals.length-1),P+(1-(v-mn)/rg)*(H-2*P)]);
  const last=vals[vals.length-1];
  return `<div class="spark"><div class="h"><span>${lab}, последние ${vals.length}</span><span>сейчас <b>${fmtv(last)}</b> · мин ${fmtv(mn)} · макс ${fmtv(mx)}</span></div>
  <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="0" x2="${W}" y1="${H-1}" y2="${H-1}" style="stroke:var(--line)"/>
  <polyline fill="none" style="stroke:var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" points="${pts.map(p=>p.join(',')).join(' ')}"/>
  <circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3.5" style="fill:var(--accent)"/></svg></div>`;
}
function renderStats(){
  renderTimes();
  const due=dueCards().length;
  $('cards-info').textContent=`Повтор: в работе ${cards.length} рук, к повтору сейчас ${due}.`;
  const ss=sessions.filter(s=>s.n>=5).slice(-30);
  $('sess-charts').innerHTML=ss.length>=2?`<div class="label">Прогресс по сессиям</div>`+spark(ss.map(s=>Math.round(s.ok/s.n*100)),'Точность',v=>v+'%')+spark(ss.filter(s=>s.tn).map(s=>+(s.ms/s.tn/1000).toFixed(1)),'Время на решение',v=>v+' с'):'';
  const last=sessions.slice(-10).reverse();
  $('sess-list').innerHTML=last.length?`<div class="label">Сессии</div><div class="sess">${last.map(s=>{
    const d=new Date(s.start),dt=d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})+', '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
    const gs=Object.entries(s.g).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([g,n])=>`${g} ${n}`).join(' · ');
    return `<div><span class="d">${dt}</span><span class="m">${fmt(s.sec)}</span><span class="m" style="text-align:left">${s.n} реш · ${Math.round(s.ok/s.n*100)}% · ${s.tn?(s.ms/s.tn/1000).toFixed(1)+' с':'-'}</span><span></span><span class="gs">${gs}</span></div>`}).join('')}</div>`:'';
  const slow=Object.entries(stats).filter(([k,v])=>BY[k.split('|')[0]]&&v[3]>=5).map(([k,v])=>[k,v[2]/v[3]]).sort((a,b)=>b[1]-a[1]).slice(0,5);
  $('slow').innerHTML=slow.length?`<div class="label">Где думаешь дольше всего</div><div class="st">${slow.map(([k,t])=>`<span>${title(k)}</span><span></span><span></span><span class="tm">${(t/1000).toFixed(1)} с</span>`).join('')}</div>`:'';
  const rows=[];
  GROUPS.forEach(g=>{
    const items=[];
    SPOTS.filter(s=>s.group===g).forEach(s=>['agro','avg','pas'].forEach(L=>['','|b'].forEach(b=>{const k=s.id+'|'+L+b,st=stats[k];if(st)items.push([title(k),st])})));
    if(items.length){rows.push(`<h3>${g}</h3>`);items.forEach(([t,st])=>{const a=Math.round(st[1]/st[0]*100);
      const c=a>=90?'var(--good)':a>=75?'var(--mix)':'var(--bad)';
      rows.push(`<span>${t}</span><span class="n">${st[0]}</span><span class="tm">${st[3]?(st[2]/st[3]/1000).toFixed(1)+' с':''}</span><span class="a" style="color:${c}">${a}%</span>`)})}
  });
  $('st-body').innerHTML=rows.length?`<div class="st"><span></span><span class="hd">раздач</span><span class="hd">время</span><span class="hd">точн.</span>${rows.join('')}</div>`:'<p class="empty">Пока пусто. Статистика появится после первых раздач.</p>';
}
$('st-reset').onclick=()=>{
  const b=$('st-reset');
  if(b.dataset.confirm){stats={};cards=[];sessions=[];curSession=null;dailyLog={};['stats','cards','sessions','dailylog'].forEach(k=>save(k,k==='dailylog'?{}:k==='stats'?{}:[]));b.textContent='Сбросить';delete b.dataset.confirm;renderStats()}
  else{b.dataset.confirm='1';b.textContent='Точно сбросить всё?';setTimeout(()=>{b.textContent='Сбросить';delete b.dataset.confirm},3000)}
};

syncSetup();renderGroups();
})();
</script>
